<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Companies · Vantage</title>
<meta name="description" content="The majors and trading houses that move the world's commodities — their operated infrastructure and where they sit in each market." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="site.css" />
</head>
<body>
<!-- Welcome / discovery screen -->
<section class="co-welcome" id="welcome" hidden>
  <div class="co-welcome-in">
    <p class="eyebrow">Companies · <span id="roster-count"></span></p>
    <h1 class="co-welcome-h">Which company's infrastructure would you like to discover?</h1>
    <div class="co-searchbox big">
      <span class="co-search-ic" aria-hidden="true">⌕</span>
      <input id="welcome-search" type="text" autocomplete="off" spellcheck="false"
             placeholder="Search a company — Aramco, Shell, Glencore…" />
      <div class="co-results" id="welcome-results"></div>
    </div>
    <div class="co-quick-lbl">Popular</div>
    <div class="co-quick" id="welcome-quick"></div>
  </div>
</section>

<!-- Company view -->
<main class="companies" id="company-view" hidden>
  <aside class="co-panel">
    <div class="co-switch">
      <div class="co-searchbox">
        <span class="co-search-ic" aria-hidden="true">⌕</span>
        <input id="co-search" type="text" autocomplete="off" spellcheck="false"
               placeholder="Search or switch company…" />
        <div class="co-results" id="co-dropdown"></div>
      </div>
      <button class="co-home" id="welcome-back" title="Back to all companies">All</button>
    </div>
    <div class="co-profile" id="profile"></div>
    <div class="co-suggest-lbl">More to explore</div>
    <div class="co-suggest" id="co-suggest"></div>
  </aside>
  <section class="co-map">
    <svg id="cmap"></svg>
    <div class="co-legend" id="legend"></div>
    <div class="co-pop" id="pop" hidden></div>
  </section>
</main>
<script src="commodities.js"></script>
<script src="nav.js"></script>
<script src="vendor/d3.min.js"></script>
<script src="supabase-config.js"></script>
<script src="companies.js"></script>
</body>
</html>
