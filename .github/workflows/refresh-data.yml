name: Refresh data

# Scheduled refresh of the Supabase store. The fetchers write straight to
# Supabase (Postgres, via the IPv4 Transaction pooler); the frontend reads
# Supabase live, so there is nothing to build, commit or redeploy here.
on:
  schedule:
    - cron: "17 * * * *"   # hourly, at :17 past the hour
  workflow_dispatch: {}

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      SUPABASE_POOLER_URL: ${{ secrets.SUPABASE_POOLER_URL }}
      ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet gdeltdoc psycopg2-binary

      - name: Fetch news → Supabase (relevance-filtered, 30-day retention)
        continue-on-error: true
        env:
          GDELT_MAX_RETRIES: "2"
          GDELT_RETRY_BASE: "5"
          GDELT_QUERY_SLEEP: "6"
        run: python data-pipeline/fetch_news_gdelt.py --timespan 7d

      - name: Fetch curated RSS news → Supabase (keyless, rubric-tagged)
        continue-on-error: true
        run: python data-pipeline/fetch_news_rss.py

      - name: Enrich news photos via og:image (keyless)
        continue-on-error: true
        run: python data-pipeline/enrich_news_images.py

      - name: Fetch prices → Supabase (FRED, keyless)
        continue-on-error: true
        run: python data-pipeline/fetch_prices_fred.py

      - name: Fetch prices → Supabase (Alpha Vantage)
        continue-on-error: true
        run: python data-pipeline/fetch_prices_alphavantage.py

      - name: Fetch share prices → Supabase (Yahoo, keyless)
        continue-on-error: true
        run: python data-pipeline/fetch_stocks.py
